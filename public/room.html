<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>정산 방</title>
  <meta name="description" content="정산은 비서끼리: 실제 방 화면">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <div class="nav-lead">
        <a class="nav-text nav-back" href="account.html"><svg width="10" height="17" viewBox="0 0 10 17" aria-hidden="true"><path d="M8.5 1.5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>내 방</span></a>
        <span class="nav-title" id="nav-title" aria-hidden="true">정산 방</span>
      </div>
      <div class="nav-actions">
        <div class="me-menu-wrap" id="me-menu-wrap">
          <button class="nav-btn nav-me" id="nav-me" type="button" data-action="toggle-me-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="me-menu" aria-label="내 계정·내 비서"><span id="nav-me-avatar"></span><span class="nav-me-label">내 계정</span></button>
          <div class="me-menu" id="me-menu" role="menu" aria-label="내 계정·내 비서" hidden>
            <button type="button" role="menuitem" id="me-menu-agent" data-action="open-agent" hidden>이 방의 내 비서</button>
            <a role="menuitem" href="account.html#profile">내 계정</a>
          </div>
        </div>
        <a class="nav-btn" href="./">데모 보기</a>
        <button class="nav-btn bell" id="nav-bell" type="button" data-action="toggle-log" aria-haspopup="dialog" aria-expanded="false" aria-controls="log-pop" aria-label="비서끼리 기록" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.6 2H4.4L6 16zM10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" id="bell-badge" hidden></span></button>
        <button class="nav-btn primary" id="nav-add" type="button" data-action="add-expense" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>지출 남기기</button>
        <span class="mode" id="mode">연결 확인 중</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <main id="main" class="main"></main>
    <aside id="channel" class="channel" aria-label="비서끼리 나눈 기록" aria-live="polite"></aside>
  </div>

  <!-- 좁은 화면: 비서끼리 기록을 이 방의 알림처럼 상단바 종에서 연다 -->
  <div class="log-pop-root" id="log-pop-root" hidden>
    <div class="log-scrim" data-action="close-log"></div>
    <section class="log-pop" id="log-pop" role="dialog" aria-label="비서끼리 기록" tabindex="-1"></section>
  </div>

  <footer class="foot">
    <p>개발 중인 실제 방 화면이에요.</p>
    <p>GDGoC DevFest 2026 「Tell the Vision」 · Team 06 Money is Our Life</p>
    <p><a href="https://github.com/orca-svg/agent-settlement/blob/main/PRIVACY.md" target="_blank" rel="noopener">개인정보 처리방침</a></p>
  </footer>

  <div class="sheet-root" id="sheet-root" hidden>
    <div class="scrim" data-action="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head" id="sheet-handle">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-bar">
          <h2 id="sheet-title"></h2>
          <button class="text-btn" type="button" data-action="close-sheet">닫기</button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <div class="photo-modal" id="photo-modal" role="dialog" aria-modal="true" aria-label="영수증 사진" hidden>
    <div class="photo-scrim" data-action="close-photo"></div>
    <figure>
      <img id="photo-img" alt="저장된 영수증 사진">
      <figcaption><button class="btn plain sm" type="button" data-action="close-photo">닫기</button></figcaption>
    </figure>
  </div>

  <script type="module" src="room.js"></script>
</body>
</html>
