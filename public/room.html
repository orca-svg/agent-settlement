<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>정산 방</title>
  <meta name="description" content="정산은 비서끼리: 실제 방 화면">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <span class="nav-title" id="nav-title" aria-hidden="true">정산 방</span>
      <div class="nav-actions">
        <a class="nav-btn" href="./">데모 보기</a>
        <button class="nav-btn primary" id="nav-add" type="button" data-action="add-expense" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>지출 남기기</button>
        <span class="mode" id="mode">연결 확인 중</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <main id="main" class="main"></main>
    <aside id="channel" class="channel" aria-label="비서끼리 나눈 기록" aria-live="polite"></aside>
  </div>

  <footer class="foot">
    <p>개발 중인 실제 방 화면이에요. 서버를 다시 켜면 메모리에 있던 방은 사라져요.</p>
    <p>GDGoC DevFest 2026 「Tell the Vision」 · Team 06 Money is Our Life</p>
  </footer>

  <div class="sheet-root" id="sheet-root" hidden>
    <div class="scrim" data-action="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head" id="sheet-handle">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-bar">
          <h2 id="sheet-title"></h2>
          <button class="text-btn" type="button" data-action="close-sheet">닫기</button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <script type="module" src="room.js"></script>
</body>
</html>
