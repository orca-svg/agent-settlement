<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>정산은 비서끼리</title>
  <meta name="description" content="돈 얘기는 각자의 AI 비서끼리 하고, 사람은 승인만 하는 정산 웹 앱 프로토타입">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <span class="nav-title" aria-hidden="true">오사카 2박 3일</span>
      <div class="nav-actions">
        <a class="nav-btn" href="account.html">로그인·내 방</a>
        <button class="nav-btn bell" id="nav-bell" type="button" data-action="toggle-log" aria-haspopup="dialog" aria-expanded="false" aria-controls="log-pop" aria-label="비서끼리 기록" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.6 2H4.4L6 16zM10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" id="bell-badge" hidden></span></button>
        <a class="nav-btn" id="to-room" href="room.html" hidden>실제 방 열기</a>
        <span class="mode" id="mode">연결 확인 중</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <main id="main" class="main"></main>
    <aside id="channel" class="channel" aria-label="비서끼리 나눈 기록" aria-live="polite"></aside>
  </div>

  <!-- 좁은 화면: 비서끼리 기록을 이 방의 알림처럼 상단바 종에서 연다 -->
  <div class="log-pop-root" id="log-pop-root" hidden>
    <div class="log-scrim" data-action="close-log"></div>
    <section class="log-pop" id="log-pop" role="dialog" aria-label="비서끼리 기록" tabindex="-1"></section>
  </div>

  <footer class="foot">
    <p>모든 금액·환율·기록은 가상의 샘플이에요. 실제 송금은 일어나지 않아요.</p>
    <p><span>GDGoC DevFest 2026 「Tell the Vision」 ·</span> <span>Team 06 Money is Our Life</span></p>
    <p><a href="https://github.com/orca-svg/agent-settlement/blob/main/PRIVACY.md" target="_blank" rel="noopener">개인정보 처리방침</a></p>
  </footer>

  <div class="sheet-root" id="sheet-root" hidden>
    <div class="scrim" data-action="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head" id="sheet-handle">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-bar">
          <h2 id="sheet-title"></h2>
          <button class="text-btn" type="button" data-action="close-sheet">닫기</button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
